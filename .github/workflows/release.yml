name: Publish

on:
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  publish:
    if: github.repository == 'tavojs/core'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.5.1

      - name: Install
        run: npm ci

      - name: Verify release
        run: npm run release:check

      - name: Publish packages and create GitHub releases
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # release:check has already built, tested, and packed both workspaces.
          # Changesets publishes workspaces concurrently, so rerunning lifecycle
          # scripts here can race while @tavojs/core replaces its dist directory.
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
